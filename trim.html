<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRIM DESK — アスペクト比トリミング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#171a21;
  --panel:#1f232c;
  --sunk:#141821;
  --edge:#2f3641;
  --paper:#e9edf3;
  --muted:#8a93a2;
  --signal:#e8b04b;
  --signal-soft:rgba(232,176,75,.14);
  --danger:#e06a5a;
  --sans:"IBM Plex Sans Condensed",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--paper);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr 312px;grid-template-rows:52px 1fr;height:100%}
.bar{
  grid-column:1/-1;display:flex;align-items:center;gap:16px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--edge);
}
.mark{font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:13px}
.mark i{color:var(--signal);font-style:normal}
.bar .meta{
  font-family:var(--mono);font-size:11.5px;color:var(--muted);
  margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;
}
.btn{
  background:transparent;border:1px solid var(--edge);color:var(--paper);
  border-radius:2px;padding:6px 12px;letter-spacing:.04em;transition:border-color .15s,background .15s;
}
.btn:hover{border-color:var(--signal);background:var(--signal-soft)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.crop:focus-visible{
  outline:2px solid var(--signal);outline-offset:2px
}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#20180a;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary:disabled:hover{filter:none}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;display:grid;place-items:center;padding:24px;
  background-image:radial-gradient(circle at 1px 1px,#232833 1px,transparent 0);background-size:22px 22px}
.empty{text-align:center;color:var(--muted);max-width:340px;user-select:none}
.empty .plate{
  border:1px dashed var(--edge);padding:34px 28px;border-radius:3px;transition:border-color .2s,background .2s;
}
.empty h1{font-size:17px;letter-spacing:.06em;color:var(--paper);margin:0 0 6px;font-weight:500}
.empty p{margin:0;font-size:13px}
.empty kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--edge);border-radius:2px;padding:1px 5px}
body.dragging .empty .plate{border-color:var(--signal);background:var(--signal-soft)}
body.dragging .stage::after{
  content:"ドロップして読み込む";position:absolute;inset:12px;border:1px dashed var(--signal);
  display:grid;place-items:center;font-size:13px;letter-spacing:.1em;color:var(--signal);
  background:rgba(23,26,33,.72);pointer-events:none;z-index:20;
}
.frame{position:relative;overflow:hidden;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.frame img{display:block;width:100%;height:100%}
.hidden{display:none !important}

/* ---------- crop box (signature) ---------- */
.crop{position:absolute;touch-action:none;cursor:move;box-shadow:0 0 0 9999px rgba(11,13,18,.66)}
.crop .ants{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(to right,#fff 0 7px,transparent 7px 14px),
    repeating-linear-gradient(to bottom,#fff 0 7px,transparent 7px 14px),
    repeating-linear-gradient(to right,#fff 0 7px,transparent 7px 14px),
    repeating-linear-gradient(to bottom,#fff 0 7px,transparent 7px 14px);
  background-size:100% 1px,1px 100%,100% 1px,1px 100%;
  background-position:0 0,100% 0,0 100%,0 0;
  background-repeat:no-repeat;
  animation:ants 14s linear infinite;
}
@keyframes ants{to{background-position:140px 0,100% 140px,-140px 100%,0 -140px}}
.crop .bracket{position:absolute;width:18px;height:18px;pointer-events:none;
  border:2px solid var(--signal);opacity:.95}
.crop .bracket.nw{left:0;top:0;border-right:0;border-bottom:0}
.crop .bracket.ne{right:0;top:0;border-left:0;border-bottom:0}
.crop .bracket.sw{left:0;bottom:0;border-right:0;border-top:0}
.crop .bracket.se{right:0;bottom:0;border-left:0;border-top:0}
.crop .thirds{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .18s;
  background-image:
    linear-gradient(to right,rgba(255,255,255,.42) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(255,255,255,.42) 1px,transparent 1px);
  background-size:33.333% 100%,100% 33.333%;background-position:33.333% 0,0 33.333%}
.crop.busy .thirds{opacity:1}
.crop .readout{
  position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:11px;
  background:rgba(11,13,18,.78);border:1px solid rgba(232,176,75,.5);color:var(--signal);
  padding:2px 6px;border-radius:2px;white-space:nowrap;pointer-events:none;
}
.crop .h{position:absolute;background:transparent}
.crop .h.nw{left:0;top:0;width:22px;height:22px;cursor:nwse-resize}
.crop .h.ne{right:0;top:0;width:22px;height:22px;cursor:nesw-resize}
.crop .h.sw{left:0;bottom:0;width:22px;height:22px;cursor:nesw-resize}
.crop .h.se{right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize}
.crop .h.n{left:22px;right:22px;top:0;height:12px;cursor:ns-resize}
.crop .h.s{left:22px;right:22px;bottom:0;height:12px;cursor:ns-resize}
.crop .h.w{top:22px;bottom:22px;left:0;width:12px;cursor:ew-resize}
.crop .h.e{top:22px;bottom:22px;right:0;width:12px;cursor:ew-resize}
.crop .h.n::after,.crop .h.s::after,.crop .h.w::after,.crop .h.e::after{
  content:"";position:absolute;background:var(--signal);opacity:.9}
.crop .h.n::after,.crop .h.s::after{left:50%;transform:translateX(-50%);width:26px;height:2px}
.crop .h.n::after{top:0}.crop .h.s::after{bottom:0}
.crop .h.w::after,.crop .h.e::after{top:50%;transform:translateY(-50%);height:26px;width:2px}
.crop .h.w::after{left:0}.crop .h.e::after{right:0}

/* ---------- panel ---------- */
.panel{background:var(--panel);border-left:1px solid var(--edge);overflow-y:auto;padding:4px 0 24px}
.sec{padding:16px;border-bottom:1px solid var(--edge)}
.sec > h2{
  margin:0 0 10px;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.sec > h2::after{content:"";flex:1;height:1px;background:var(--edge)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  position:relative;display:inline-flex;align-items:center;gap:6px;
  background:var(--sunk);border:1px solid var(--edge);border-radius:2px;
  padding:6px 9px;font-family:var(--mono);font-size:12px;letter-spacing:.02em;transition:.15s;
}
.chip:hover{border-color:#4a5464}
.chip[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-soft);color:var(--signal)}
.chip .x{border:0;background:transparent;color:var(--muted);padding:0 0 0 2px;font-size:13px;line-height:1}
.chip .x:hover{color:var(--danger)}
.addrow{display:flex;align-items:center;gap:6px;margin-top:10px}
.addrow input{
  width:100%;min-width:0;background:var(--sunk);border:1px solid var(--edge);border-radius:2px;
  padding:6px 8px;font-family:var(--mono);font-size:12px;text-align:center;
}
.addrow input:focus{outline:none;border-color:var(--signal)}
.addrow span{color:var(--muted);font-family:var(--mono)}

.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{width:38px;height:20px;flex:none;border-radius:10px;background:var(--sunk);
  border:1px solid var(--edge);position:relative;transition:.18s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:var(--muted);transition:.18s}
.switch input:checked + .track{background:var(--signal-soft);border-color:var(--signal)}
.switch input:checked + .track::after{transform:translateX(18px);background:var(--signal)}
.switch input:focus-visible + .track{outline:2px solid var(--signal);outline-offset:2px}

.readouts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-family:var(--mono);font-size:12px}
.readouts div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--edge);padding-bottom:3px}
.readouts b{font-weight:500}
.readouts span{color:var(--muted)}

.seg{display:flex;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.seg button{flex:1;background:var(--sunk);border:0;border-right:1px solid var(--edge);
  padding:7px 0;font-family:var(--mono);font-size:12px;color:var(--muted);transition:.15s}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--signal-soft);color:var(--signal)}
.range{display:flex;align-items:center;gap:10px;margin-top:12px}
.range input[type=range]{flex:1;accent-color:var(--signal);min-width:0}
.range b{font-family:var(--mono);font-size:12px;font-weight:500;width:34px;text-align:right}
.filename{
  margin-top:12px;background:var(--sunk);border:1px solid var(--edge);border-radius:2px;
  padding:8px 10px;font-family:var(--mono);font-size:11.5px;color:var(--signal);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sec .save{width:100%;margin-top:12px;padding:10px 0}
.rowbtns{display:flex;gap:6px;margin-top:12px}
.rowbtns .btn{flex:1;padding:6px 4px;font-size:12.5px}

@media (max-width:820px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:52px minmax(46vh,1fr) auto;height:auto;min-height:100%}
  .panel{border-left:0;border-top:1px solid var(--edge)}
  .bar .meta{max-width:36vw}
}
@media (prefers-reduced-motion:reduce){
  .crop .ants{animation:none}
  *{transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="mark">Trim<i>/</i>Desk</div>
    <button class="btn" id="pickBtn">画像を選ぶ</button>
    <div class="meta" id="meta">画像を読み込んでください</div>
  </header>

  <main class="stage" id="stage">
    <div class="empty" id="empty">
      <div class="plate">
        <h1>画像をここにドロップ</h1>
        <p>クリックしてファイルを選ぶ／<kbd>Ctrl</kbd>+<kbd>V</kbd> で貼り付けもできます</p>
      </div>
    </div>
    <div class="frame hidden" id="frame">
      <img id="photo" alt="読み込んだ画像">
      <div class="crop" id="crop" tabindex="0" role="application" aria-label="トリミング範囲。矢印キーで移動">
        <span class="ants"></span>
        <span class="thirds"></span>
        <span class="bracket nw"></span><span class="bracket ne"></span>
        <span class="bracket sw"></span><span class="bracket se"></span>
        <span class="h nw" data-h="nw"></span><span class="h n" data-h="n"></span><span class="h ne" data-h="ne"></span>
        <span class="h w" data-h="w"></span><span class="h e" data-h="e"></span>
        <span class="h sw" data-h="sw"></span><span class="h s" data-h="s"></span><span class="h se" data-h="se"></span>
        <span class="readout" id="readout">0 × 0</span>
      </div>
    </div>
  </main>

  <aside class="panel">
    <section class="sec">
      <h2>アスペクト比</h2>
      <div class="chips" id="chips"></div>
      <div class="addrow">
        <input id="addW" type="number" min="1" step="1" placeholder="幅" aria-label="追加する比率の幅">
        <span>:</span>
        <input id="addH" type="number" min="1" step="1" placeholder="高さ" aria-label="追加する比率の高さ">
        <button class="btn" id="addBtn">追加</button>
      </div>
      <p class="note" id="storeNote">追加した比率はこのブラウザに保存されます。</p>
    </section>

    <section class="sec">
      <h2>固定</h2>
      <label class="switch">
        <input type="checkbox" id="lock">
        <span class="track"></span>
        <span>アスペクト比を固定する</span>
      </label>
      <p class="note">オフでも四隅のドラッグは比率を保ちます。オンにすると上下左右のドラッグでも比率を保ちます。</p>
    </section>

    <section class="sec">
      <h2>トリミング範囲</h2>
      <div class="readouts">
        <div><span>幅</span><b id="rW">—</b></div>
        <div><span>高さ</span><b id="rH">—</b></div>
        <div><span>左</span><b id="rX">—</b></div>
        <div><span>上</span><b id="rY">—</b></div>
      </div>
      <div class="rowbtns">
        <button class="btn" id="maxBtn">最大サイズ</button>
        <button class="btn" id="centerBtn">中央に配置</button>
      </div>
    </section>

    <section class="sec">
      <h2>書き出し</h2>
      <div class="seg" id="fmt">
        <button data-fmt="jpeg" aria-pressed="true">jpg</button>
        <button data-fmt="png" aria-pressed="false">png</button>
        <button data-fmt="webp" aria-pressed="false">webp</button>
      </div>
      <div class="range" id="qRow">
        <span style="color:var(--muted);font-size:12px">画質</span>
        <input type="range" id="quality" min="40" max="100" step="1" value="92" aria-label="画質">
        <b id="qVal">92</b>
      </div>
      <div class="filename" id="outName">—</div>
      <button class="btn primary save" id="saveBtn" disabled>保存する</button>
    </section>
  </aside>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const stage=$('stage'), frame=$('frame'), photo=$('photo'), cropEl=$('crop'),
      readout=$('readout'), empty=$('empty'), meta=$('meta'), fileInput=$('file');

const DEFAULTS = [[3,4],[4,3],[9,16],[16,9]];
const MIN = 16;               // 最小の切り抜きサイズ（元画像のピクセル）
const COOKIE = 'trimdesk_ratios';

const S = {
  img:null, iw:0, ih:0, scale:1,
  base:'image', ext:'png',
  crop:{x:0,y:0,w:0,h:0},
  ratio:null,                 // 選択中の比率（幅/高さ）。null は自由
  ratioKey:null,              // 選択中のプリセット識別子
  locked:false,
  fmt:'jpeg', quality:0.92,
  custom:[]
};

/* ---------- 保存（cookie → 使えなければ localStorage → メモリ） ---------- */
const store = {
  mode:'cookie',
  read(){
    try{
      const m = document.cookie.match(new RegExp('(?:^|; )'+COOKIE+'=([^;]*)'));
      if(m) return JSON.parse(decodeURIComponent(m[1]));
    }catch(e){}
    try{
      const v = localStorage.getItem(COOKIE);
      if(v){ this.mode='local'; return JSON.parse(v); }
    }catch(e){}
    return null;
  },
  write(list){
    const raw = JSON.stringify(list);
    try{
      document.cookie = COOKIE+'='+encodeURIComponent(raw)+'; path=/; max-age=31536000; SameSite=Lax';
      if(document.cookie.indexOf(COOKIE+'=') !== -1){ this.mode='cookie'; return true; }
    }catch(e){}
    try{ localStorage.setItem(COOKIE, raw); this.mode='local'; return true; }catch(e){}
    this.mode='memory'; return false;
  }
};

const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const keyOf=(w,h)=>w+':'+h;

/* ---------- 比率チップ ---------- */
function loadCustom(){
  const saved = store.read();
  S.custom = Array.isArray(saved)
    ? saved.filter(p => Array.isArray(p) && p.length===2 && p[0]>0 && p[1]>0).slice(0,24)
    : [];
}
function saveCustom(){
  const ok = store.write(S.custom);
  const note = $('storeNote');
  if(!ok) note.textContent = 'この環境では比率を保存できないため、追加分はページを閉じるまで有効です。';
  else if(store.mode==='local') note.textContent = 'この環境ではcookieが使えないため、ブラウザ内の保存領域に記録しています。';
  else note.textContent = '追加した比率はこのブラウザのcookieに保存されます。';
}
function renderChips(){
  const box = $('chips');
  box.innerHTML='';
  const mk = (label, key, ratio, removable) => {
    const b=document.createElement('button');
    b.className='chip'; b.type='button'; b.setAttribute('aria-pressed', String(S.ratioKey===key));
    b.append(label);
    if(removable){
      const x=document.createElement('button');
      x.className='x'; x.type='button'; x.textContent='×';
      x.title=label+' を削除'; x.setAttribute('aria-label', label+' を削除');
      x.addEventListener('click', ev=>{
        ev.stopPropagation();
        S.custom = S.custom.filter(p=>keyOf(p[0],p[1])!==key);
        if(S.ratioKey===key){ S.ratioKey=null; S.ratio=null; }
        saveCustom(); renderChips();
      });
      b.appendChild(x);
    }
    b.addEventListener('click', ()=>selectRatio(key, ratio));
    box.appendChild(b);
  };
  mk('自由', null, null, false);
  DEFAULTS.forEach(([w,h]) => mk(w+':'+h, keyOf(w,h), w/h, false));
  S.custom.forEach(([w,h]) => mk(w+':'+h, keyOf(w,h), w/h, true));
}
function selectRatio(key, ratio){
  S.ratioKey = key; S.ratio = ratio;
  renderChips();
  if(S.img && ratio){ conform(); paint(); }
}
$('addBtn').addEventListener('click', ()=>{
  const w = Math.round(Number($('addW').value)), h = Math.round(Number($('addH').value));
  if(!(w>0 && h>0)){ $('addW').focus(); return; }
  const key = keyOf(w,h);
  const exists = DEFAULTS.some(p=>keyOf(p[0],p[1])===key) || S.custom.some(p=>keyOf(p[0],p[1])===key);
  if(!exists) S.custom.push([w,h]);
  saveCustom();
  $('addW').value=''; $('addH').value='';
  selectRatio(key, w/h);
});
$('addH').addEventListener('keydown', e=>{ if(e.key==='Enter') $('addBtn').click(); });

/* ---------- 画像の読み込み ---------- */
function loadFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    S.img=img; S.iw=img.naturalWidth; S.ih=img.naturalHeight;
    const dot = file.name.lastIndexOf('.');
    S.base = dot>0 ? file.name.slice(0,dot) : (file.name || 'image');
    photo.src = url;
    empty.classList.add('hidden'); frame.classList.remove('hidden');
    meta.textContent = file.name + '  ·  ' + S.iw + '×' + S.ih + ' px';
    $('saveBtn').disabled = false;
    resetCrop(); fit(); paint();
  };
  img.onerror = () => { meta.textContent = '画像を読み込めませんでした。別のファイルを試してください。'; };
  img.src = url;
}
function resetCrop(){
  S.crop = {x:0, y:0, w:S.iw, h:S.ih};
  if(S.ratio) conform();
}
$('pickBtn').addEventListener('click', ()=>fileInput.click());
empty.addEventListener('click', ()=>fileInput.click());
fileInput.addEventListener('change', e=>{ loadFile(e.target.files[0]); fileInput.value=''; });

let dragDepth=0;
window.addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
window.addEventListener('dragover', e=>e.preventDefault());
window.addEventListener('dragleave', e=>{ if(--dragDepth<=0){ dragDepth=0; document.body.classList.remove('dragging'); } });
window.addEventListener('drop', e=>{
  e.preventDefault(); dragDepth=0; document.body.classList.remove('dragging');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) loadFile(f);
});
window.addEventListener('paste', e=>{
  const items = e.clipboardData && e.clipboardData.files;
  if(items && items[0]) loadFile(items[0]);
});

/* ---------- 表示サイズの計算と描画 ---------- */
function fit(){
  if(!S.img) return;
  const pad = 48;
  const sw = Math.max(80, stage.clientWidth - pad);
  const sh = Math.max(80, stage.clientHeight - pad);
  S.scale = Math.min(sw/S.iw, sh/S.ih, 2);
  frame.style.width = (S.iw*S.scale)+'px';
  frame.style.height = (S.ih*S.scale)+'px';
}
function paint(){
  if(!S.img) return;
  const c=S.crop, s=S.scale;
  cropEl.style.left   = (c.x*s)+'px';
  cropEl.style.top    = (c.y*s)+'px';
  cropEl.style.width  = (c.w*s)+'px';
  cropEl.style.height = (c.h*s)+'px';
  const w=Math.round(c.w), h=Math.round(c.h);
  readout.textContent = w+' × '+h;
  $('rW').textContent = w+' px'; $('rH').textContent = h+' px';
  $('rX').textContent = Math.round(c.x)+' px'; $('rY').textContent = Math.round(c.y)+' px';
  updateName();
}
window.addEventListener('resize', ()=>{ fit(); paint(); });

/* ---------- 比率へ合わせる ---------- */
function conform(){
  const r = S.ratio; if(!r) return;
  const c = S.crop;
  const cx = c.x + c.w/2, cy = c.y + c.h/2;
  let w = Math.min(c.w, S.iw), h = w/r;
  if(h > S.ih){ h = S.ih; w = h*r; }
  if(w > S.iw){ w = S.iw; h = w/r; }
  S.crop = {
    x: clamp(cx - w/2, 0, S.iw - w),
    y: clamp(cy - h/2, 0, S.ih - h),
    w, h
  };
}
$('maxBtn').addEventListener('click', ()=>{
  if(!S.img) return;
  const r = S.ratio;
  if(!r){ S.crop={x:0,y:0,w:S.iw,h:S.ih}; }
  else{
    let w=S.iw, h=w/r;
    if(h>S.ih){ h=S.ih; w=h*r; }
    S.crop={x:(S.iw-w)/2, y:(S.ih-h)/2, w, h};
  }
  paint();
});
$('centerBtn').addEventListener('click', ()=>{
  if(!S.img) return;
  S.crop.x = (S.iw - S.crop.w)/2;
  S.crop.y = (S.ih - S.crop.h)/2;
  paint();
});

/* ---------- ドラッグ操作 ---------- */
let drag = null;
function toNatural(ev){
  const r = frame.getBoundingClientRect();
  return { x:(ev.clientX - r.left)/S.scale, y:(ev.clientY - r.top)/S.scale };
}
cropEl.addEventListener('pointerdown', ev=>{
  if(!S.img) return;
  const handle = ev.target.dataset ? ev.target.dataset.h : null;
  const mode = handle ? 'resize' : 'move';
  // 比率が選ばれていて、固定オフのまま上下左右をドラッグしたら「自由」に切り替える
  if(mode==='resize' && handle.length===1 && S.ratio && !S.locked){
    S.ratioKey=null; S.ratio=null; renderChips();
  }
  const p = toNatural(ev);
  drag = { mode, handle, start:p, from:Object.assign({}, S.crop) };
  cropEl.classList.add('busy');
  cropEl.setPointerCapture(ev.pointerId);
  ev.preventDefault();
});
cropEl.addEventListener('pointermove', ev=>{
  if(!drag) return;
  const p = toNatural(ev);
  if(drag.mode==='move'){
    const f=drag.from;
    S.crop.x = clamp(f.x + (p.x - drag.start.x), 0, S.iw - f.w);
    S.crop.y = clamp(f.y + (p.y - drag.start.y), 0, S.ih - f.h);
  }else{
    S.crop = resize(drag.handle, p.x, p.y, drag.from);
  }
  paint();
});
function endDrag(ev){
  if(!drag) return;
  drag=null; cropEl.classList.remove('busy');
  if(ev && cropEl.hasPointerCapture(ev.pointerId)) cropEl.releasePointerCapture(ev.pointerId);
}
cropEl.addEventListener('pointerup', endDrag);
cropEl.addEventListener('pointercancel', endDrag);

function resize(handle, nx, ny, from){
  const corner = handle.length === 2;
  const ratio = (corner || S.locked) ? S.ratio : null;
  let L=from.x, T=from.y, R=from.x+from.w, B=from.y+from.h;

  if(!ratio){
    if(handle.indexOf('w')>=0) L = clamp(nx, 0, R-MIN);
    if(handle.indexOf('e')>=0) R = clamp(nx, L+MIN, S.iw);
    if(handle.indexOf('n')>=0) T = clamp(ny, 0, B-MIN);
    if(handle.indexOf('s')>=0) B = clamp(ny, T+MIN, S.ih);
    return {x:L, y:T, w:R-L, h:B-T};
  }

  const minW = Math.max(MIN, MIN*ratio);
  if(corner){
    const ax = handle.indexOf('w')>=0 ? R : L;   // 対角の固定点
    const ay = handle.indexOf('n')>=0 ? B : T;
    const maxW = handle.indexOf('w')>=0 ? ax : S.iw-ax;
    const maxH = handle.indexOf('n')>=0 ? ay : S.ih-ay;
    let w = Math.max(Math.abs(nx-ax), Math.abs(ny-ay)*ratio);
    w = Math.min(w, maxW, maxH*ratio);
    w = Math.max(w, Math.min(minW, maxW, maxH*ratio));
    const h = w/ratio;
    const x = handle.indexOf('w')>=0 ? ax-w : ax;
    const y = handle.indexOf('n')>=0 ? ay-h : ay;
    return {x, y, w, h};
  }

  if(handle==='e' || handle==='w'){
    const cy = (T+B)/2;
    const maxH = 2*Math.min(cy, S.ih-cy);
    const maxW = handle==='e' ? S.iw-L : R;
    let w = handle==='e' ? nx-L : R-nx;
    w = Math.min(Math.max(w, minW), maxW, maxH*ratio);
    const h = w/ratio;
    return {
      x: handle==='e' ? L : R-w,
      y: clamp(cy-h/2, 0, S.ih-h),
      w, h
    };
  }
  // n / s
  const cx = (L+R)/2;
  const maxW2 = 2*Math.min(cx, S.iw-cx);
  const maxH2 = handle==='s' ? S.ih-T : B;
  let h = handle==='s' ? ny-T : B-ny;
  h = Math.min(Math.max(h, minW/ratio), maxH2, maxW2/ratio);
  const w = h*ratio;
  return {
    x: clamp(cx-w/2, 0, S.iw-w),
    y: handle==='s' ? T : B-h,
    w, h
  };
}

cropEl.addEventListener('keydown', e=>{
  if(!S.img) return;
  const step = e.shiftKey ? 10 : 1;
  const map = {ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step]};
  const d = map[e.key];
  if(!d) return;
  S.crop.x = clamp(S.crop.x + d[0], 0, S.iw - S.crop.w);
  S.crop.y = clamp(S.crop.y + d[1], 0, S.ih - S.crop.h);
  paint(); e.preventDefault();
});

$('lock').addEventListener('change', e=>{ S.locked = e.target.checked; });

/* ---------- 書き出し ---------- */
const EXT = {jpeg:'jpg', png:'png', webp:'webp'};
$('fmt').addEventListener('click', e=>{
  const b = e.target.closest('button[data-fmt]'); if(!b) return;
  S.fmt = b.dataset.fmt;
  [...$('fmt').children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  $('qRow').style.display = (S.fmt==='png') ? 'none' : '';
  updateName();
});
$('quality').addEventListener('input', e=>{
  S.quality = Number(e.target.value)/100;
  $('qVal').textContent = e.target.value;
});
function updateName(){
  $('outName').textContent = S.img ? (S.base + '_trim.' + EXT[S.fmt]) : '—';
}
$('saveBtn').addEventListener('click', ()=>{
  if(!S.img) return;
  const c = S.crop;
  const w = Math.max(1, Math.round(c.w)), h = Math.max(1, Math.round(c.h));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  if(S.fmt==='jpeg'){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h); }
  ctx.drawImage(S.img, Math.round(c.x), Math.round(c.y), w, h, 0, 0, w, h);
  const type = 'image/'+S.fmt;
  cv.toBlob(blob=>{
    if(!blob){ meta.textContent='この形式で書き出せませんでした。別の形式を選んでください。'; return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = S.base + '_trim.' + EXT[S.fmt];
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }, type, S.fmt==='png' ? undefined : S.quality);
});

/* ---------- 起動 ---------- */
loadCustom();
renderChips();
saveCustom();
updateName();
})();
</script>
</body>
