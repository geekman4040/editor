<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDITOR — 画像編集ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #171a21;
      --panel: #1f232c;
      --sunk: #141821;
      --edge: #2f3641;
      --edge-hover: #454f5f;
      --paper: #e9edf3;
      --muted: #8a93a2;
      --signal: #e8b04b;
      --signal-soft: rgba(232, 176, 75, 0.08);
      --signal-glow: rgba(232, 176, 75, 0.18);
      --sans: "IBM Plex Sans Condensed", -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--canvas);
      color: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
      position: relative;
      overflow: hidden;
    }

    /* 背景の繊細なドットグリッド */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--edge) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.35;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* ヘッダー・ロゴ */
    .brand {
      text-align: center;
    }

    .brand h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-left: 0.28em; /* letter-spacingのオフセット補正 */
      color: var(--paper);
    }

    .brand h1 span {
      color: var(--signal);
    }

    .brand p {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ナビゲーションカードリスト */
    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 520px) {
      .menu {
        grid-template-columns: 1fr;
      }
    }

    .card {
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 4px;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .card:hover {
      border-color: var(--signal);
      background: #232832;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--signal-glow);
    }

    .card:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 2px;
    }

    .card-badge {
      align-self: flex-start;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      background: var(--sunk);
      border: 1px solid var(--edge);
      border-radius: 2px;
      color: var(--muted);
      margin-bottom: 20px;
      transition: border-color 0.2s, color 0.2s;
    }

    .card:hover .card-badge {
      border-color: var(--signal);
      color: var(--signal);
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-arrow {
      font-family: var(--mono);
      font-size: 16px;
      color: var(--muted);
      transition: transform 0.2s ease, color 0.2s;
    }

    .card:hover .card-arrow {
      color: var(--signal);
      transform: translateX(4px);
    }

    .card-desc {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* フッター */
    .footer {
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      opacity: 0.6;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand">
      <h1>EDI<span>T</span>OR</h1>
      <p>Image Processing Suite</p>
    </header>

    <nav class="menu" aria-label="ツール一覧">
      <a href="trim.html" class="card">
        <span class="card-badge">TOOL 01</span>
        <div class="card-title">
          <span>TRIM</span>
          <span class="card-arrow" aria-hidden="true">→</span>
        </div>
        <p class="card-desc">アスペクト比トリミング・切り抜き</p>
      </a>

      <a href="concat.html" class="card">
        <span class="card-badge">TOOL 02</span>
        <div class="card-title">
          <span>CONCAT</span>
          <span class="card-arrow" aria-hidden="true">→</span>
        </div>
        <p class="card-desc">複数画像の連結・結合</p>
      </a>
    </nav>

    <footer class="footer">
      <span>LOCAL CLIENT UTILITY</span>
    </footer>
  </main>
</body>
</html>
